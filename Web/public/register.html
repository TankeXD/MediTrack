<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MediTrack | Registro</title>
  <meta name="description" content="Registro de cuenta para MediTrack">
  <meta name="theme-color" content="#0d9488">
  <!-- PWA: Mobile/iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MediTrack">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PANTALLA DE REGISTRO -->
  <div id="login-screen">
    <div class="glass-panel login-box">
      <h1>Registro</h1>
      <p>Crea una cuenta para empezar a usar MediTrack.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña (Mínimo 6 caracteres)</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" id="btn-register" class="btn btn-primary">
          <span id="register-text">Crear Cuenta</span>
          <div id="register-loader" class="loader hidden"></div>
        </button>
        
        <div class="divider">
          <span>O</span>
        </div>
        
        <button type="button" id="btn-google-login" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
          <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
            <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
              <path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/>
              <path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/>
              <path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/>
              <path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/>
            </g>
          </svg>
          Ingresar con Google
        </button>
        
        <div style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); text-align: center;">
          <span id="auth-switch-text">¿Ya tienes cuenta?</span> 
          <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Inicia sesión aquí</a>
        </div>
      </form>
    </div>
  </div>

  <!-- CONTENEDOR DE TOASTS -->
  <div id="toast-container" class="toast-container"></div>

  <!-- LÓGICA DE REGISTRO -->
  <script type="module" src="register.js"></script>

  <!-- PWA REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registrado', reg.scope))
          .catch(err => console.error('Error SW:', err));
      });
    }
  </script>
</body>
</html>
